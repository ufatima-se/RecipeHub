{% extends "layout.html" %}

{% block title %}
Edit Recipe
{% endblock %}

{% block main %}

<div class="container" style="max-width: 850px;">

    <div class="card shadow-lg border-0 rounded-4 p-5">

        <h1 class="fw-bold mb-4 text-center">Edit Recipe</h1>

        <form action="/edit/{{ recipe['id'] }}" method="POST" enctype="multipart/form-data">

            <!-- Recipe Title -->
            <div class="mb-3">
                <label class="form-label fw-semibold">Recipe Title</label>
                <input
                    class="form-control"
                    type="text"
                    name="title"
                    value="{{ recipe['title'] }}"
                    required>
            </div>

            <!-- Description -->
            <div class="mb-3">
                <label class="form-label fw-semibold">Description</label>
                <textarea
                    class="form-control"
                    name="description"
                    rows="3"
                    required>{{ recipe['description'] }}</textarea>
            </div>

            <!-- Ingredients -->
            <div class="mb-3">
                <label class="form-label fw-semibold">Ingredients</label>
                <textarea
                    class="form-control"
                    name="ingredients"
                    rows="6"
                    required>{{ recipe['ingredients'] }}</textarea>
            </div>

            <!-- Instructions -->
            <div class="mb-4">
                <label class="form-label fw-semibold">Instructions</label>
                <textarea
                    class="form-control"
                    name="instructions"
                    rows="6"
                    required>{{ recipe['instructions'] }}</textarea>
            </div>

            <!-- Times & Servings -->
            <div class="row">

                <div class="col-md-4 mb-3">
                    <label class="form-label fw-semibold">Prep Time (mins)</label>
                    <input
                        class="form-control"
                        type="number"
                        name="prep_time"
                        value="{{ recipe['prep_time'] }}"
                        required>
                </div>

                <div class="col-md-4 mb-3">
                    <label class="form-label fw-semibold">Cook Time (mins)</label>
                    <input
                        class="form-control"
                        type="number"
                        name="cook_time"
                        value="{{ recipe['cook_time'] }}"
                        required>
                </div>

                <div class="col-md-4 mb-3">
                    <label class="form-label fw-semibold">Servings</label>
                    <input
                        class="form-control"
                        type="number"
                        name="servings"
                        value="{{ recipe['servings'] }}"
                        required>
                </div>

            </div>

            <!-- Difficulty & Category -->
            <div class="row">

                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold">Difficulty</label>
                    <input
                        class="form-control"
                        type="text"
                        name="difficulty"
                        value="{{ recipe['difficulty'] }}"
                        required>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold">Category</label>
                    <input
                        class="form-control"
                        type="text"
                        name="category"
                        value="{{ recipe['category'] }}"
                        required>
                </div>

            </div>

            <!-- Image -->
            <div class="mb-4">

                <label class="form-label fw-semibold">
                    Change Recipe Image (Optional)
                </label>

                <input
                    class="form-control"
                    type="file"
                    id="image"
                    name="image"
                    accept="image/*">

                {% if recipe["image"] %}
                    <img
                        id="preview"
                        src="{{ url_for('static', filename='uploads/' + recipe['image']) }}"
                        alt="Recipe Image"
                        class="img-fluid rounded-4 shadow mt-3"
                        style="max-width:300px;">
                {% else %}
                    <img
                        id="preview"
                        src=""
                        alt="Image Preview"
                        class="img-fluid rounded-4 shadow mt-3"
                        style="display:none; max-width:300px;">
                {% endif %}

            </div>

            <!-- Submit -->
            <div class="text-center">

                <button
                    type="submit"
                    class="btn btn-dark rounded-pill px-5 py-2 fw-semibold">

                    Save Changes

                </button>

            </div>

        </form>

    </div>

</div>

<script>

const input = document.getElementById("image");
const preview = document.getElementById("preview");

input.addEventListener("change", function () {

    if (input.files && input.files[0]) {

        preview.src = URL.createObjectURL(input.files[0]);
        preview.style.display = "block";

    }

});

</script>

{% endblock %}
